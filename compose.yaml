# 3-node Raft KV cluster for real-process tests (kill -9, restart, recovery from the file WAL).
#
# STATUS: target for M5. It will not start until raft-node has a main class, gRPC transport
# and raft-node/Dockerfile. The environment variables below are the contract that main must honour.
#
#   docker compose up -d            # start the cluster
#   docker compose kill node2       # SIGKILL == kill -9: no shutdown hooks, no final fsync
#   docker compose start node2      # restart; the node must recover from its own volume
#   docker compose down -v          # stop and WIPE all data volumes

x-raft-node: &raft-node
  image: raft-kv-node:dev
  build:
    context: .
    dockerfile: raft-node/Dockerfile
  environment: &raft-env
    RAFT_PEERS: "1=node1:7000,2=node2:7000,3=node3:7000"   # fixed membership (no reconfiguration in v1)
    RAFT_PEER_PORT: "7000"                                 # node-to-node gRPC, internal network only
    RAFT_CLIENT_PORT: "8080"                               # client API
    RAFT_DATA_DIR: "/data"                                 # WAL segments + snapshots
  networks: [raft-net]
  # Never auto-restart: crash tests decide when a node comes back.
  restart: "no"
  # Named volumes (not bind mounts): on macOS, Docker Desktop's bind-mount file sharing
  # can weaken fsync guarantees. Named volumes live on the Linux VM's own disk.

services:
  node1:
    <<: *raft-node
    container_name: raft-node1
    hostname: node1
    environment:
      <<: *raft-env
      RAFT_NODE_ID: "1"
    ports: ["8081:8080"]
    volumes: ["node1-data:/data"]

  node2:
    <<: *raft-node
    container_name: raft-node2
    hostname: node2
    environment:
      <<: *raft-env
      RAFT_NODE_ID: "2"
    ports: ["8082:8080"]
    volumes: ["node2-data:/data"]

  node3:
    <<: *raft-node
    container_name: raft-node3
    hostname: node3
    environment:
      <<: *raft-env
      RAFT_NODE_ID: "3"
    ports: ["8083:8080"]
    volumes: ["node3-data:/data"]

networks:
  raft-net: {}

volumes:
  node1-data: {}
  node2-data: {}
  node3-data: {}
